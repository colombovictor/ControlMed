
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="src/style.css/style.css">
    <link rel="shortcut icon" href="src/img/prescricao-medica.png" type="image/x-icon">
</head>

<body>

<div class="container">

    <div class="topo">
        <h1>Cadastro de Usuário</h1>
        <p>Preencha os dados abaixo</p>
    </div>

    <form class="formulario">

        <div class="campo">
            <label>Nome</label>
            <input type="text" placeholder="Digite o nome">
        </div>

        <div class="campo">
            <label>Sobrenome</label>
            <input type="text" placeholder="Digite o sobrenome">
        </div>

        <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Digite o email">
        </div>
 <div class="campo">
            <label>Email do familiar responsável</label>
            <input type="email" placeholder="Digite o email do familiar">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" placeholder="Digite a senha">
        </div>

        <div class="campo">
            <label>Telefone</label>
            <input type="number" placeholder="Digite o telefone">
        </div>

        <div class="campo">
            <label>Data de Nascimento</label>
            <input type="date">
        </div>

        <div class="campo">
            <label>Sexo</label>
            <select>
                <option>Selecione</option>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Outro</option>
            </select>
        </div>

        <div class="campo full">
            <label>Doenças</label>
            <textarea placeholder="Digite as doenças do usuário"></textarea>
        </div>

        <div class="botao">
            <a href="home.html" class="btn-login"> Entrar </a>

        </div>

    </form>

</div>

</body>
</html>
