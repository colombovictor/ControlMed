<!-- login.html -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ControlMed</title>

    <link rel="stylesheet" href="src/style.css/style.css">
    <link rel="shortcut icon" href="src/img/prescricao-medica.png" type="image/x-icon">

    <!-- ICONES -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <section class="login-container">

     

        <!-- FORM LOGIN -->

        <div class="login-box">

            <div class="login-topo">

                <h2>Bem-vindo 👋</h2>

                <p>
                    Faça login para continuar
                </p>

            </div>

            <form class="formulario">

                <div class="campo">

                    <label>Email</label>

                    <div class="input-icon">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                        type="email"
                        placeholder="Digite seu email">

                    </div>

                </div>

                <div class="campo">

                    <label>Senha</label>

                    <div class="input-icon">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        placeholder="Digite sua senha">

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        <span>Lembrar senha</span>

                    </label>

                    <a href="esqueceuSenha.html">
                        Esqueceu a senha?
                    </a>

                </div>

                <button class="btn-login">
                    Entrar
                </button>

            </form>

            <div class="cadastro-link">

                <p>
                    Não possui conta?
                    <a href="cadastroDeUsuario.html">
                        Criar conta
                    </a>
                </p>

            </div>

        </div>

    </section>

</body>
</html>
