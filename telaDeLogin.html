<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | ControlMed</title>

    <link rel="stylesheet" href="src/style.css/style.css" />
    <link
      rel="shortcut icon"
      href="src/img/prescricao-medica.png"
      type="image/x-icon"
    />

    <!-- ICONES (Font Awesome 6) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <section class="login-container">
      <!-- FORM LOGIN -->

      <div class="login-box">
        <div class="login-topo">
          <h2>Bem-vindo 👋</h2>
          <p>Faça login para continuar no sistema</p>
        </div>

        <form class="formulario">
          <!-- Campo Email -->
          <div class="campo">
            <label>Email</label>
            <div class="input-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" placeholder="Digite seu email" required />
            </div>
          </div>

          <!-- Campo Senha -->
          <div class="campo">
            <label>Senha</label>
            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" placeholder="Digite sua senha" required />
            </div>
          </div>

          <!-- Opções extras (Lembrar / Esqueci senha) -->
          <div class="login-options">
            <label class="remember">
              <input type="checkbox" />
              <span>Lembrar de mim</span>
            </label>

            <a href="esqueceu-senha.html">Esqueceu a senha?</a>
          </div>

          <!-- Botão Entrar -->
          <a href="home.html" class="btn-login">
            <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i> Entrar
          </a>
        </form>

        <!-- Link para Cadastro -->
        <div class="cadastro-link">
          <p>
            Não possui conta?
            <a href="cadastroDeUsuario.html">Criar conta</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
