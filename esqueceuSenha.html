<!-- esqueceu-senha.html -->

<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">


    <title>Esqueceu a Senha | ControlMed</title>

    <link rel="stylesheet"
    href="src/style.css/style.css">

    <!-- ICONES -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <section class="forgot-container">

        <div class="forgot-box">

            <!-- TOPO -->

            <div class="forgot-topo">

                <div class="icon-lock">

                    <i class="fa-solid fa-lock"></i>

                </div>

                <h1>Esqueceu a senha?</h1>

                <p>
                    Informe seu email para receber
                    o link de recuperação.
                </p>

            </div>

            <!-- FORM -->

            <form class="formulario">

                <div class="campo">

                    <label>Email</label>

                    <div class="input-icon">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                        type="email"
                        placeholder="Digite seu email">

                    </div>

                </div>

                <button class="btn-recuperar">

                    Enviar Link

                </button>

            </form>

            <!-- VOLTAR -->

            <div class="voltar-login">

                <a href="telaDeLogin.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Voltar para login

                </a>

            </div>

        </div>

    </section>

</body>
</html>
