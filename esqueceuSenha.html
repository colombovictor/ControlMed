<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha | ControlMed</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="src/img/prescricao-medica.png" type="image/x-icon">

    <!-- ICONES (Font Awesome 6) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <section class="forgot-container">

        <!-- TOPO -->
        <div class="forgot-topo" style="text-align: center;">
            <div class="icon-lock" style="margin-bottom: 20px;">
                <!-- Um ícone de escudo ou cadeado destacado em roxo para chamar a atenção do usuário -->
                <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: #5b34f2;"></i>
            </div>
            <h1>Esqueceu a senha?</h1>
            <p>
                Não se preocupe! Informe o seu e-mail cadastrado abaixo e enviaremos as instruções para recuperar seu acesso.
            </p>
        </div>

        <!-- FORMULÁRIO -->
        <form class="formulario">

            <div class="campo">
                <label>E-mail cadastrado</label>
                <div class="input-icon">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Digite seu email" required>
                </div>
            </div>

            <button type="submit" class="btn-recuperar">
                <i class="fa-regular fa-paper-plane" style="margin-right: 10px;"></i> Enviar Link de Recuperação
            </button>

        </form>

        <!-- LINK PARA VOLTAR -->
        <div class="voltar-login" style="margin-top: 25px; text-align: center;">
            <a href="telaDeLogin.html" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o login
            </a>
        </div>

    </section>

</body>
</html>
