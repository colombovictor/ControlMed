<!-- home.html -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Home | ControlMed</title>

    <link rel="stylesheet"
    href="src/style.css/style.css">

    <!-- ICONES -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="home-container">

        <!-- TOPO -->

        <header class="topbar">

            <div>

                <h1>ControlMed 💊</h1>

                <p>
                    Bem-vindo ao sistema
                </p>

            </div>

            <button class="perfil-btn">

                <i class="fa-solid fa-user"></i>

            </button>

        </header>

        <!-- CARDS -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-pills"></i>

                <h2>Medicamentos</h2>

                <p>
                    Gerencie seus medicamentos
                </p>

            </div>

            <div class="card">

                <i class="fa-solid fa-box"></i>

                <h2>Estoque</h2>

                <p>
                    Controle o estoque
                </p>

            </div>

            <div class="card">

                <i class="fa-solid fa-clock"></i>

                <h2>Horários</h2>

                <p>
                    Organize os horários
                </p>

            </div>

            <div class="card">

                <i class="fa-solid fa-users"></i>

                <h2>Pacientes</h2>

                <p>
                    Gerencie os pacientes
                </p>

            </div>

        </section>

        <!-- ATIVIDADES -->

        <section class="atividade">

            <h2>Últimas Atividades</h2>

            <div class="atividade-box">

                <p>
                    ✔ Medicamento cadastrado
                </p>

                <p>
                    ✔ Estoque atualizado
                </p>

                <p>
                    ✔ Novo paciente adicionado
                </p>

            </div>

        </section>

    </div>

</body>
</html>
