
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Medicamentos</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="src/img/prescricao-medica.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <div class="container">
      <div class="topo">
        <h1>Cadastro de Medicamento 💊</h1>
        <p>Preencha as informações abaixo</p>
      </div>

      <form id="formMedicamento" class="formulario">
        <div class="campo">
          <label>Nome do Medicamento</label>
          <input type="text" id="medNome" placeholder="Digite o nome" required />
        </div>

        <div class="campo">
          <label>Dosagem</label>
          <input type="text" id="medDosagem" placeholder="Ex: 500mg" required />
        </div>

        <div class="campo">
          <label>Quantidade em Estoque</label>
          <input type="number" id="medEstoque" placeholder="Quantidade" min="0" required />
        </div>

        <div class="campo">
          <label>Data de Validade</label>
          <input type="date" id="medValidade" required />
        </div>

        <div class="campo">
          <label>Horário 1</label>
          <input type="time" id="medHorario1" />
        </div>

        <div class="campo">
          <label>Horário 2</label>
          <input type="time" id="medHorario2" />
        </div>

        <div class="botao campo-completo">
          <button type="submit">Cadastrar Medicamento</button>
        </div>
      </form>

      <p style="text-align:center; margin-top: 10px;">
        <a href="home.html">Voltar para a Home</a>
      </p>
    </div>

    <script type="module" src="./dist/classes/cadrastroDeMedicamentos.js"></script>
  </body>
</html>
