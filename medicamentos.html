<!-- index.html -->

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Medicamentos</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="src/img/prescricao-medica.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <!-- FORMULARIO -->
    <div class="container">
      <div class="topo">
        <h1>Cadastro de Medicamento 💊</h1>

        <p>Preencha as informações abaixo</p>
      </div>

      <form class="formulario">
        <div class="campo">
          <label>Nome do Medicamento</label>
          <input type="text" placeholder="Digite o nome" />
        </div>

        <div class="campo">
          <label>Dosagem</label>
          <input type="text" placeholder="Ex: 500mg" />
        </div>

        <div class="campo">
          <label>Quantidade em Estoque</label>
          <input type="number" placeholder="Quantidade" />
        </div>

        <div class="campo">
          <label>Horário 1</label>
          <input type="time" />
        </div>

        <div class="campo">
          <label>Horário 2</label>
          <input type="time" />
        </div>

        <div class="campo full">
          <label>Tomado Hoje?</label>

          <select>
            <option>Selecione</option>
            <option>Sim</option>
            <option>Não</option>
          </select>
        </div>

        <div class="botao">
          <button type="submit">Cadastrar Medicamento</button>
        </div>
      </form>
    </div>
  </body>
</html>
